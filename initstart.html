<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OlexOS 7 Offline Feature: Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
      background: #f5f5f5;
    }
    .save-container {
      width: 100%;
      max-width: 600px;
      margin-top: 50px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
      text-align: center;
    }
    .logo { margin-bottom: 30px; }
    .logo img { height: 80px; width: auto; }
    .progress-wrapper {
      width: 100%;
      background-color: #eee;
      border-radius: 25px;
      overflow: hidden;
    }
    .progress-bar {
      width: 0%;
      height: 20px;
      background-color: #4CAF50;
      transition: width 0.2s ease-in-out;
    }
    .progress-text { margin-top: 10px; font-size: 14px; }
    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <audio style="display:none"
         src="https://koolkat226.github.io/oos/sounds/loading.mp3"
         autoplay loop>
  </audio>
  <div class="save-container">
    <div class="logo">
      <img src="./oosgames.png" alt="Games Logo" />
    </div>
    <div class="progress-wrapper">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="progress-text" id="progress-text">0 / 0</div>
    <div class="status" id="status-text">‣ Registering service worker...</div>
  </div>

  <script>
    // 1) Configuration
    const CACHE_NAME = 'oosgames';
    const START_URL  = '/';
    const ORIGIN     = window.location.origin;
    const MAX_PAGES  = 1000;
    const EXTRA_URLS = [
      './oosg/index.html?game=retrobowl',
      './oosg/index.html?game=subwaysurfers',
      './oosg/index.html?game=mk64',
      './oosg/index.html?game=funnyshooter2',
      './oosg/index.html?game=eos3',
      './oosg/index.html?game=doodlejump',
      './oosg/index.html?game=corbin',
      './oosg/index.html?game=ghostchatbot',
      './oosg/index.html?game=happyfriday',
      './oosg/index.html?game=cube',
      './oosg/index.html?game=spelunky/src',
      './oosg/index.html?game=minecraft',
      './oosg/index.html?game=mario64',
      './oosg/index.html',
      './oosg/retrobowl/index.html',
      './oosg/subwaysurfers/index.html',
      './oosg/mk64/index.html',
      './oosg/funnyshooter2/index.html',
      './oosg/eos3/index.html',
      './oosg/doodlejump/index.html',
      './oosg/corbin/index.html',
      './oosg/ghostchatbot/index.html',
      './oosg/happyfriday/index.html',
      './oosg/cube/index.html',
      './oosg/spelunky/index.html',
      './oosg/minecraft/index.html',
      './oosg/mario64/index.html'
    ];

    // 2) DOM references
    const progressBarEl  = document.getElementById('progress-bar');
    const progressTextEl = document.getElementById('progress-text');
    const statusTextEl   = document.getElementById('status-text');

    // 3) Detect fresh install vs update
    const wasInstalledBefore = !!localStorage.getItem('oosgames_urls');
    const actionLabel       = wasInstalledBefore ? 'Updating' : 'Installing';

    // Clear old record so we overwrite it below
    localStorage.removeItem('oosgames_urls');

    // 4) Register the service worker
    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        statusTextEl.textContent = '❌ Service worker unsupported';
        throw new Error('SW unsupported');
      }
      try {
        await navigator.serviceWorker.register('./service-worker.js');
        statusTextEl.textContent = '✅ Service worker registered';
        await navigator.serviceWorker.ready;
        statusTextEl.textContent = '✅ Service worker active';
      } catch (err) {
        statusTextEl.textContent = '❌ Failed to register SW';
        throw err;
      }
    }

    // 5) Crawl your site for page URLs
    async function crawlSiteAndCollectPageURLs() {
      const visitedPages = new Set();
      const queue        = [new URL(START_URL, ORIGIN).href];
      const collected    = new Set();

      EXTRA_URLS.forEach(rel => {
        try {
          const abs = new URL(rel, ORIGIN).href;
          if (abs.startsWith(ORIGIN)) queue.push(abs);
        } catch {}
      });

      while (queue.length > 0 && visitedPages.size < MAX_PAGES) {
        const pageURL = queue.shift();
        if (visitedPages.has(pageURL)) continue;
        visitedPages.add(pageURL);

        statusTextEl.textContent = `🔍 Site crawl (${visitedPages.size})`;

        let htmlText;
        try {
          const resp = await fetch(pageURL, { credentials: 'same-origin' });
          if (!resp.ok) continue;
          htmlText = await resp.text();
        } catch {
          continue;
        }

        collected.add(pageURL);
        const doc = new DOMParser().parseFromString(htmlText, 'text/html');
        doc.querySelectorAll('a[href]').forEach(anchor => {
          const raw = anchor.getAttribute('href');
          if (
            raw &&
            !raw.startsWith('mailto:') &&
            !raw.startsWith('tel:') &&
            !raw.startsWith('javascript:') &&
            !raw.startsWith('#')
          ) {
            try {
              const abs = new URL(raw, pageURL).href;
              if (abs.startsWith(ORIGIN) && !visitedPages.has(abs)) {
                queue.push(abs);
              }
            } catch {}
          }
        });
      }

      return Array.from(collected);
    }

    // 6) Discover assets via hidden iframes
    async function discoverAssetsFromPages(pageURLs) {
      const discoveredAssets = new Set();

      for (let i = 0; i < pageURLs.length; i++) {
        const pageURL = pageURLs[i];
        statusTextEl.textContent =
          `🔄 ${actionLabel} OOS Game Library (${i+1}/${pageURLs.length})`;

        const iframe = document.createElement('iframe');
        Object.assign(iframe.style, {
          position: 'fixed',
          left: '-9999px',
          top: '-9999px',
          width: '1px',
          height: '1px'
        });
        iframe.src = pageURL;
        document.body.appendChild(iframe);

        await new Promise(resolve => {
          let done = false;
          iframe.addEventListener('load', () => {
            if (!done) { done = true; resolve(); }
          });
          setTimeout(() => {
            if (!done) { done = true; resolve(); }
          }, 15000);
        });

        await new Promise(r => setTimeout(r, 1000));

        try {
          const win = iframe.contentWindow;
          if (win && typeof win.__getAllAssets === 'function') {
            discoveredAssets.add(pageURL);
            const assets = await win.__getAllAssets();
            assets.forEach(u => discoveredAssets.add(u));
          }
        } catch {}

        document.body.removeChild(iframe);
      }

      return Array.from(discoveredAssets);
    }

    // 7) Cache everything (with cache-clear on update!)
    async function cacheAllResources(urls) {
      // **DELETE** the old cache so we force fresh network fetches
      await caches.delete(CACHE_NAME);

      const cache = await caches.open(CACHE_NAME);
      const total = urls.length;
      let count   = 0;

      for (let resourceURL of urls) {
        try {
          await cache.add(resourceURL);
        } catch {}
        finally {
          count++;
          const pct = Math.round((count / total) * 100);
          progressBarEl.style.width  = pct + '%';
          progressTextEl.textContent = `${count} / ${total}`;
        }
      }

      statusTextEl.textContent =
        `✅ OOS Game Library ${wasInstalledBefore ? 'updated' : 'installed'}!`;

      // Save the new list
      localStorage.setItem('oosgames_urls', JSON.stringify(urls));

      // Redirect home
      window.location.href = 'https://koolkat226.github.io/oos/';
    }

    // 8) Orchestrator
    async function runSaveProcess() {
      try {
        await registerServiceWorker();
      } catch {
        return;
      }

      statusTextEl.textContent = `🔍 Verifying OOS Game Library assets…`;
      let pageURLs;
      try {
        pageURLs = await crawlSiteAndCollectPageURLs();
      } catch {
        statusTextEl.textContent = '❌ Unexpected error';
        return;
      }

      if (pageURLs.length === 0) {
        statusTextEl.textContent = '⚠️ No files found';
        return;
      }

      statusTextEl.textContent = `🔄 Discovering assets…`;
      let allURLs;
      try {
        const assetURLs = await discoverAssetsFromPages(pageURLs);
        allURLs = Array.from(new Set([...pageURLs, ...assetURLs]));
      } catch {
        statusTextEl.textContent = '❌ Asset discovery failed';
        return;
      }

      statusTextEl.textContent =
        `📥 ${actionLabel} ${allURLs.length} resources…`;
      await cacheAllResources(allURLs);
    }

    window.addEventListener('load', runSaveProcess);
  </script>
</body>
</html>

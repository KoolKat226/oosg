<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fullscreen Iframe with Loading + Blur Cover</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: white;
      color: black;
      font-size: 48px;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10000;
    }

    #dim-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 36px;
      font-family: Arial, sans-serif;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 9999;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<div id="loading-overlay">Loading...</div>
<div id="dim-overlay">Click to return</div>

<iframe src="https://koolkat226.github.io/oosm/"></iframe>

<script>
  const loadingOverlay = document.getElementById('loading-overlay');
  const dimOverlay = document.getElementById('dim-overlay');

  const alreadyVisited = localStorage.getItem('visitedBefore') === 'true';
  const delay = alreadyVisited ? 10000 : 20000;
  localStorage.setItem('visitedBefore', 'true');

  setTimeout(() => {
    loadingOverlay.style.display = 'none';
  }, delay);

  // Show dim overlay when mouse leaves the page
  document.addEventListener('mouseleave', () => {
    dimOverlay.style.display = 'flex';
  });

  // Hide dim overlay and refocus on click
  dimOverlay.addEventListener('click', () => {
    dimOverlay.style.display = 'none';
    window.focus();
  });
</script>

</body>
</html>
